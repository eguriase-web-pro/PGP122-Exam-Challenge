<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNGPD LIFE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111a;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   SPLASH
========================= */

#splash{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#12334b 0%,#07111a 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.splash-box{
    text-align:center;
    padding:30px;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#35d07f;
}

.subtitle{
    margin-top:10px;
    color:#9bb0c2;
}

.loader{
    width:220px;
    height:5px;
    background:#172733;
    border-radius:10px;
    margin:30px auto 0;
    overflow:hidden;
}

.loader div{
    height:100%;
    width:45%;
    background:#35d07f;
    animation:load 1.3s infinite;
}

@keyframes load{
    from{transform:translateX(-100%);}
    to{transform:translateX(500%);}
}

/* =========================
   AUTH
========================= */

.screen{
    min-height:100vh;
    padding:25px;
}

.auth-wrap{
    max-width:430px;
    margin:50px auto;
}

.card{
    background:#0d1b26;
    border:1px solid #1c3445;
    border-radius:18px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.card h1{
    margin-bottom:8px;
}

.muted{
    color:#8da4b5;
}

.input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #294354;
    background:#08141e;
    color:#fff;
    border-radius:10px;
    outline:none;
}

.input:focus{
    border-color:#35d07f;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 17px;
    font-weight:700;
    margin-top:12px;
}

.btn.primary{
    background:#35d07f;
    color:#06120b;
}

.btn.secondary{
    background:#1b3445;
    color:#fff;
}

.btn.danger{
    background:#b83232;
    color:#fff;
}

.full{
    width:100%;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    color:#8da4b5;
}

.auth-switch span{
    color:#35d07f;
    cursor:pointer;
}

/* =========================
   ASSESSMENT
========================= */

#assessmentScreen{
    display:none;
}

.assessment-box{
    max-width:650px;
    margin:30px auto;
}

.assessment-option{
    width:100%;
    text-align:left;
    background:#101f2b;
    color:#fff;
    border:1px solid #294354;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

.assessment-option:hover{
    border-color:#35d07f;
}

.progress{
    width:100%;
    height:7px;
    background:#182a37;
    border-radius:10px;
    margin:20px 0;
    overflow:hidden;
}

.progress div{
    height:100%;
    background:#35d07f;
}

/* =========================
   GAME
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:#091722;
    border-bottom:1px solid #1d3545;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.player-mini{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#35d07f;
    color:#06120b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    color:#b9cad5;
    font-size:13px;
}

.game-content{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.world{
    position:relative;
    min-height:520px;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #234152;
    background:
        linear-gradient(90deg,rgba(22,62,49,.5) 1px,transparent 1px),
        linear-gradient(rgba(22,62,49,.5) 1px,transparent 1px),
        #10271f;
    background-size:50px 50px;
}

.world-title{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(5,15,22,.85);
    padding:10px 14px;
    border-radius:10px;
    z-index:5;
}

.player{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:10px;
    background:#35d07f;
    color:#07111a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:900;
    z-index:10;
    transition:.08s;
}

.location{
    position:absolute;
    min-width:120px;
    padding:12px;
    border-radius:12px;
    text-align:center;
    background:#10202c;
    border:1px solid #365366;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.location:hover{
    border-color:#35d07f;
    transform:translateY(-2px);
}

.loc-library{left:8%;top:20%}
.loc-class{left:38%;top:14%}
.loc-hostel{right:8%;top:22%}
.loc-canteen{left:12%;bottom:18%}
.loc-lab{left:42%;bottom:12%}
.loc-arena{right:10%;bottom:18%}

.controls{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:15px;
}

.control-btn{
    width:50px;
    height:50px;
    border-radius:10px;
    border:1px solid #294354;
    background:#10202c;
    color:#fff;
    font-size:20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:sticky;
    bottom:0;
    z-index:100;
    background:#091722;
    border-top:1px solid #1d3545;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    padding:8px;
}

.nav-btn{
    background:none;
    border:0;
    color:#91a8b8;
    padding:8px 3px;
    font-size:12px;
}

.nav-btn:hover{
    color:#35d07f;
}

/* =========================
   PANEL
========================= */

#gamePanel{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.65);
}

.panel{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0b1822;
    border:1px solid #274354;
    border-radius:20px 20px 0 0;
    padding:22px;
}

.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.close-btn{
    border:0;
    background:#182d3b;
    color:#fff;
    width:36px;
    height:36px;
    border-radius:50%;
}

.panel-section{
    background:#10202c;
    padding:15px;
    border-radius:12px;
    margin-top:12px;
}

/* =========================
   QUIZ
========================= */

.quiz-option{
    width:100%;
    text-align:left;
    background:#10202c;
    border:1px solid #294354;
    color:#fff;
    padding:14px;
    border-radius:10px;
    margin-top:9px;
}

.quiz-option:hover{
    border-color:#35d07f;
}

.quiz-option.selected{
    border-color:#35d07f;
    background:#15372a;
}

/* =========================
   ARENA
========================= */

.arena-card{
    background:#10202c;
    border:1px solid #294354;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
}

.match-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #203846;
}

.match-row:last-child{
    border-bottom:0;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:8px;
    background:#183344;
    color:#9fd7ba;
    font-size:11px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    background:#0b1822;
    border:1px solid #365366;
    padding:12px 17px;
    border-radius:10px;
    z-index:2000;
    display:none;
    max-width:90%;
    text-align:center;
}
</style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<div id="splash">
    <div class="splash-box">
        <div class="logo">PNGPD <span>LIFE</span></div>
        <div class="subtitle">Your department. Your campus. Your life.</div>
        <div class="loader"><div></div></div>
    </div>
</div>

<!-- =========================
     LOGIN / REGISTER
========================= -->

<div id="authScreen" class="screen">

    <div class="auth-wrap">

        <div class="card">

            <h1 id="authTitle">Welcome to PNGPD LIFE</h1>

            <p class="muted" id="authSubtitle">
                Enter the PNGPD world.
            </p>

            <div id="registerFields">

                <input
                    id="fullName"
                    class="input"
                    placeholder="Full name"
                    autocomplete="name"
                >

            </div>

            <input
                id="email"
                class="input"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="password"
                class="input"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                id="authButton"
                class="btn primary full"
                onclick="PNGPD.submitAuth()"
            >
                CREATE ACCOUNT
            </button>

            <div class="auth-switch">
                <span id="authSwitchText">
                    Already have an account?
                </span>

                <span
                    id="authSwitchAction"
                    onclick="PNGPD.toggleAuth()"
                >
                    Login
                </span>
            </div>

        </div>

    </div>

</div>

<!-- =========================
     ASSESSMENT
========================= -->

<div id="assessmentScreen" class="screen">

    <div class="assessment-box">

        <div class="card">

            <h1>🧠 Entry Assessment</h1>

            <p class="muted" style="margin-top:8px;">
                Complete the assessment to determine your starting profile.
            </p>

            <div class="progress">
                <div id="assessmentProgress"></div>
            </div>

            <div id="assessmentQuestion"></div>

        </div>

    </div>

</div>

<!-- =========================
     GAME
========================= -->

<div id="gameScreen">

    <div class="topbar">

        <div class="player-mini">

            <div class="avatar" id="playerAvatar">
                P
            </div>

            <div>
                <strong id="playerName">
                    Player
                </strong>

                <div
                    id="playerLevel"
                    class="muted"
                >
                    Level 1
                </div>

            </div>

        </div>

        <div class="stats">

            <span>💰 ₦<b id="money">0</b></span>
            <span>⭐ <b id="xp">0</b> XP</span>
            <span>❤️ <b id="energy">100</b></span>

        </div>

    </div>

    <div class="game-content">

        <div class="world">

            <div class="world-title">
                📍 PTI — PNGPD Campus
            </div>

            <div
                id="playerCharacter"
                class="player"
                style="left:48%;top:45%;"
            >
                P
            </div>

            <button
                class="location loc-library"
                onclick="PNGPD.visitLocation('library')"
            >
                📚<br>Library
            </button>

            <button
                class="location loc-class"
                onclick="PNGPD.visitLocation('classroom')"
            >
                🏫<br>Classroom
            </button>

            <button
                class="location loc-hostel"
                onclick="PNGPD.visitLocation('hostel')"
            >
                🛏️<br>Hostel
            </button>

            <button
                class="location loc-canteen"
                onclick="PNGPD.visitLocation('canteen')"
            >
                🍲<br>Canteen
            </button>

            <button
                class="location loc-lab"
                onclick="PNGPD.visitLocation('lab')"
            >
                🔬<br>Laboratory
            </button>

            <button
                class="location loc-arena"
                onclick="PNGPD.visitLocation('arena')"
            >
                🏟️<br>Arena
            </button>

        </div>

        <div class="controls">

            <button
                class="control-btn"
                onclick="PNGPD.movePlayer('up')"
            >⬆️</button>

            <button
                class="control-btn"
                onclick="PNGPD.movePlayer('left')"
            >⬅️</button>

            <button
                class="control-btn"
                onclick="PNGPD.movePlayer('down')"
            >⬇️</button>

            <button
                class="control-btn"
                onclick="PNGPD.movePlayer('right')"
            >➡️</button>

        </div>

    </div>

    <div class="bottom-nav">

        <button
            class="nav-btn"
            onclick="PNGPD.openBank()"
        >
            💰<br>Bank
        </button>

        <button
            class="nav-btn"
            onclick="PNGPD.openShop()"
        >
            🛒<br>Shop
        </button>

        <button
            class="nav-btn"
            onclick="PNGPD.openProperties()"
        >
            🏠<br>Properties
        </button>

        <button
            class="nav-btn"
            onclick="PNGPD.openGarage()"
        >
            🚗<br>Garage
        </button>

        <button
            class="nav-btn"
            onclick="PNGPD.openTournaments()"
        >
            🏆<br>Events
        </button>

    </div>

</div>

<!-- =========================
     PANEL
========================= -->

<div
    id="gamePanel"
    onclick="if(event.target===this) PNGPD.closePanel()"
>

    <div class="panel">

        <div class="panel-head">

            <h2 id="panelTitle">
                PNGPD LIFE
            </h2>

            <button
                class="close-btn"
                onclick="PNGPD.closePanel()"
            >
                ✕
            </button>

        </div>

        <div id="panelContent"></div>

    </div>

</div>

<div id="toast"></div>

<!-- =========================
     PROJECT FILES
========================= -->

<script src="data/questions.js"></script>
<script src="data/locations.js"></script>
<script src="game/playerMovement.js"></script>
<script src="game/profile.js"></script>
<script src="game/actions.js"></script>

<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://xlylxyxjsvhvrnjrcvrf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UNIyxQ_8WvQzR2t2fCjKtQ_MNcIJ7T9";

let pngpdSupabase = null;

try{

    pngpdSupabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    window.pngpdSupabase =
        pngpdSupabase;

}catch(error){

    console.error(
        "Supabase connection failed:",
        error
    );

}

/* =========================================================
   MAIN GAME OBJECT
========================================================= */

const PNGPD = {

    player:null,

    authMode:"register",

    assessmentQuestions:[],

    assessmentIndex:0,

    assessmentScore:0,

    /* =========================
       TOAST
    ========================= */

    toast(message){

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.style.display = "block";

        clearTimeout(window._pngpdToast);

        window._pngpdToast =
            setTimeout(()=>{
                toast.style.display = "none";
            },2500);

    },

    /* =========================
       PANELS
    ========================= */

    openPanel(title,content){

        document.getElementById(
            "panelTitle"
        ).textContent = title;

        document.getElementById(
            "panelContent"
        ).innerHTML = content;

        document.getElementById(
            "gamePanel"
        ).style.display = "flex";

    },

    closePanel(){

        document.getElementById(
            "gamePanel"
        ).style.display = "none";

    },

    /* =========================
       AUTH MODE
    ========================= */

    toggleAuth(){

        this.authMode =
            this.authMode === "register"
            ? "login"
            : "register";

        const registerFields =
            document.getElementById(
                "registerFields"
            );

        const title =
            document.getElementById(
                "authTitle"
            );

        const subtitle =
            document.getElementById(
                "authSubtitle"
            );

        const button =
            document.getElementById(
                "authButton"
            );

        const switchText =
            document.getElementById(
                "authSwitchText"
            );

        const switchAction =
            document.getElementById(
                "authSwitchAction"
            );

        if(this.authMode === "register"){

            registerFields.style.display =
                "block";

            title.textContent =
                "Welcome to PNGPD LIFE";

            subtitle.textContent =
                "Create your PNGPD LIFE account.";

            button.textContent =
                "CREATE ACCOUNT";

            switchText.textContent =
                "Already have an account?";

            switchAction.textContent =
                "Login";

        }else{

            registerFields.style.display =
                "none";

            title.textContent =
                "Welcome Back";

            subtitle.textContent =
                "Login to continue your PNGPD LIFE.";

            button.textContent =
                "LOGIN";

            switchText.textContent =
                "Don't have an account?";

            switchAction.textContent =
                "Register";

        }

    },

    /* =========================
       AUTH
    ========================= */

    async submitAuth(){

        if(!pngpdSupabase){

            this.toast(
                "Supabase is not connected."
            );

            return;

        }

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        if(!email || !password){

            this.toast(
                "Enter your email and password."
            );

            return;

        }

        try{

            if(this.authMode === "register"){

                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();

                if(!fullName){

                    this.toast(
                        "Enter your full name."
                    );

                    return;

                }

                const {data,error} =
                    await pngpdSupabase.auth.signUp({

                        email,

                        password,

                        options:{
                            data:{
                                full_name:fullName
                            }
                        }

                    });

                if(error) throw error;

                if(data.session){

                    await this.afterLogin(
                        data.session
                    );

                }else{

                    this.toast(
                        "Account created. Check your email if confirmation is required."
                    );

                }

            }else{

                const {data,error} =
                    await pngpdSupabase.auth.signInWithPassword({

                        email,

                        password

                    });

                if(error) throw error;

                await this.afterLogin(
                    data.session
                );

            }

        }catch(error){

            console.error(error);

            this.toast(
                error.message ||
                "Authentication failed."
            );

        }

    },

    async afterLogin(session){

        if(!session){

            this.toast(
                "No active session."
            );

            return;

        }

        window.pngpdSession =
            session;

        await this.loadPlayer();

    },

    /* =========================
       LOAD PLAYER
    ========================= */

    async loadPlayer(){

        const user =
            (await pngpdSupabase.auth.getUser()).data.user;

        if(!user){

            this.showAuth();

            return;

        }

        let stored =
            localStorage.getItem(
                "pngpd_player"
            );

        if(stored){

            try{

                this.player =
                    JSON.parse(stored);

            }catch{

                this.player = null;

            }

        }

        if(!this.player){

            this.player = {

                id:user.id,

                name:
                    user.user_metadata?.full_name ||
                    user.email?.split("@")[0] ||
                    "Player",

                email:user.email,

                level:1,

                xp:0,

                money:5000,

                energy:100,

                intelligence:0,

                assessmentScore:0,

                createdAt:
                    new Date().toISOString()

            };

            this.savePlayer();

        }

        this.showGame();

        this.updateHUD();

    },

    savePlayer(){

        localStorage.setItem(
            "pngpd_player",
            JSON.stringify(this.player)
        );

    },

    /* =========================
       SCREENS
    ========================= */

    showAuth(){

        document.getElementById(
            "authScreen"
        ).style.display = "block";

        document.getElementById(
            "assessmentScreen"
        ).style.display = "none";

        document.getElementById(
            "gameScreen"
        ).style.display = "none";

    },

    showAssessment(){

        document.getElementById(
            "authScreen"
        ).style.display = "none";

        document.getElementById(
            "assessmentScreen"
        ).style.display = "block";

        document.getElementById(
            "gameScreen"
        ).style.display = "none";

    },

    showGame(){

        document.getElementById(
            "authScreen"
        ).style.display = "none";

        document.getElementById(
            "assessmentScreen"
        ).style.display = "none";

        document.getElementById(
            "gameScreen"
        ).style.display = "block";

    },

    /* =========================
       HUD
    ========================= */

    updateHUD(){

        if(!this.player) return;

        document.getElementById(
            "playerName"
        ).textContent =
            this.player.name;

        document.getElementById(
            "playerLevel"
        ).textContent =
            `Level ${this.player.level}`;

        document.getElementById(
            "money"
        ).textContent =
            Number(this.player.money || 0).toLocaleString();

        document.getElementById(
            "xp"
        ).textContent =
            this.player.xp || 0;

        document.getElementById(
            "energy"
        ).textContent =
            this.player.energy ?? 100;

        const first =
            (this.player.name || "P")
            .charAt(0)
            .toUpperCase();

        document.getElementById(
            "playerAvatar"
        ).textContent = first;

        document.getElementById(
            "playerCharacter"
        ).textContent = first;

    },

    /* =========================
       XP
    ========================= */

    addXP(amount){

        if(!this.player) return;

        this.player.xp =
            Number(this.player.xp || 0) +
            Number(amount || 0);

        const required =
            this.player.level * 100;

        if(this.player.xp >= required){

            this.player.xp -= required;

            this.player.level++;

            this.toast(
                `🎉 Level ${this.player.level}!`
            );

        }

        this.savePlayer();

        this.updateHUD();

    },

    /* =========================
       MOVEMENT
    ========================= */

    movePlayer(direction){

        const character =
            document.getElementById(
                "playerCharacter"
            );

        if(!character) return;

        let left =
            parseFloat(character.style.left) || 48;

        let top =
            parseFloat(character.style.top) || 45;

        const step = 3;

        if(direction === "left")
            left -= step;

        if(direction === "right")
            left += step;

        if(direction === "up")
            top -= step;

        if(direction === "down")
            top += step;

        left =
            Math.max(2,Math.min(94,left));

        top =
            Math.max(8,Math.min(90,top));

        character.style.left =
            left + "%";

        character.style.top =
            top + "%";

    },

    /* =========================
       LOCATIONS
    ========================= */

    visitLocation(location){

        switch(location){

            case "library":

                if(typeof window.openLibrary === "function"){

                    window.openLibrary();

                }else{

                    this.openBank(
                        "📚 Library"
                    );

                }

                break;

            case "classroom":

                this.startStudy();

                break;

            case "hostel":

                this.rest();

                break;

            case "canteen":

                this.eat();

                break;

            case "lab":

                this.labChallenge();

                break;

            case "arena":

                this.battle();

                break;

            default:

                this.toast(
                    "Location unavailable."
                );

        }

    },

    /* =========================
       STUDY
    ========================= */

    startStudy(){

        this.openPanel(

            "📚 Study",

            `

            <div class="panel-section">

                <h3>Choose a course</h3>

                <p class="muted" style="margin-top:8px;">
                    Select a course to start studying.
                </p>

            </div>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 121')"
            >
                PGP 121
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 122')"
            >
                PGP 122
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 123')"
            >
                PGP 123
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 124')"
            >
                PGP 124
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 125')"
            >
                PGP 125
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 126')"
            >
                PGP 126
            </button>

            <button
                class="btn primary full"
                onclick="PNGPD.startQuiz('PGP 127')"
            >
                PGP 127
            </button>

            <button
                class="btn secondary full"
                onclick="PNGPD.startQuiz('MTH 101')"
            >
                MTH 101
            </button>

            <button
                class="btn secondary full"
                onclick="PNGPD.startQuiz('MTH 112')"
            >
                MTH 112
            </button>

            <button
                class="btn secondary full"
                onclick="PNGPD.startQuiz('GNS 101')"
            >
                GNS 101
            </button>

            <button
                class="btn secondary full"
                onclick="PNGPD.startQuiz('GNS 111')"
            >
                GNS 111
            </button>

            `

        );

    },

    startQuiz(subject){

        if(
            typeof window.startQuiz ===
            "function"
        ){

            window.startQuiz(subject);

            return;

        }

        this.runLocalQuiz(subject);

    },

    runLocalQuiz(subject){

        const bank =
            window.PNGPD_QUESTIONS;

        let questions = [];

        if(Array.isArray(bank)){

            questions =
                bank.filter(q => {

                    const course =
                        q.course ||
                        q.subject ||
                        q.code;

                    return String(course)
                        .toLowerCase()
                        .replace(/\s/g,"")
                        ===
                        String(subject)
                        .toLowerCase()
                        .replace(/\s/g,"");

                });

        }else if(
            bank &&
            typeof bank === "object"
        ){

            questions =
                bank[subject] ||
                bank[subject.replace(" ","")] ||
                [];

        }

        if(!questions.length){

            this.openPanel(

                subject,

                `

                <div class="panel-section">

                    <h3>Question bank not loaded</h3>

                    <p class="muted" style="margin-top:8px;">
                        The question bank for
                        ${subject}
                        is empty or has not been loaded.
                    </p>

                </div>

                `

            );

            return;

        }

        questions =
            [...questions]
            .sort(()=>Math.random()-.5)
            .slice(0,30);

        window._pngpdQuiz = {

            subject,

            questions,

            index:0,

            score:0

        };

        this.renderLocalQuiz();

    },

    renderLocalQuiz(){

        const quiz =
            window._pngpdQuiz;

        if(!quiz) return;

        if(
            quiz.index >=
            quiz.questions.length
        ){

            this.finishLocalQuiz();

            return;

        }

        const q =
            quiz.questions[quiz.index];

        const question =
            q.question ||
            q.question_text ||
            q.text ||
            "Question";

        const options = [

            q.option_a ?? q.a ?? q.options?.[0],

            q.option_b ?? q.b ?? q.options?.[1],

            q.option_c ?? q.c ?? q.options?.[2],

            q.option_d ?? q.d ?? q.options?.[3]

        ];

        this.openPanel(

            `📖 ${quiz.subject}`,

            `

            <div class="panel-section">

                <span class="badge">
                    Question ${quiz.index+1}/${quiz.questions.length}
                </span>

                <h3 style="margin-top:15px;">
                    ${this.escapeHTML(question)}
                </h3>

            </div>

            <div>

                ${options.map((option,index)=>`

                    <button
                        class="quiz-option"
                        onclick="PNGPD.answerLocalQuiz(${index})"
                    >
                        <b>${String.fromCharCode(65+index)}.</b>
                        ${this.escapeHTML(option || "")}
                    </button>

                `).join("")}

            </div>

            `

        );

    },

    answerLocalQuiz(index){

        const quiz =
            window._pngpdQuiz;

        const q =
            quiz.questions[quiz.index];

        const correct =
            q.correct_answer ??
            q.answer ??
            q.correctAnswer;

        const letter =
            String.fromCharCode(
                65 + index
            );

        if(
            String(correct)
            .trim()
            .toUpperCase()
            ===
            letter
            ||
            String(correct)
            .trim()
            ===
            String(index)
        ){

            quiz.score++;

            this.toast("✅ Correct!");

        }else{

            this.toast("❌ Incorrect.");

        }

        quiz.index++;

        setTimeout(
            ()=>this.renderLocalQuiz(),
            350
        );

    },

    finishLocalQuiz(){

        const quiz =
            window._pngpdQuiz;

        const total =
            quiz.questions.length;

        const percent =
            Math.round(
                quiz.score / total * 100
            );

        this.addXP(
            quiz.score * 5
        );

        this.openPanel(

            `📊 ${quiz.subject} Result`,

            `

            <div class="panel-section">

                <h2>
                    ${quiz.score}/${total}
                </h2>

                <p class="muted" style="margin-top:8px;">
                    Score: ${percent}%
                </p>

            </div>

            <button
                class="btn primary full"
                onclick="PNGPD.closePanel()"
            >
                CONTINUE
            </button>

            `

        );

        window._pngpdQuiz = null;

    },

    /* =========================
       OTHER ACTIVITIES
    ========================= */

    labChallenge(){

        this.addXP(5);

        this.openPanel(

            "🔬 Laboratory",

            `

            <div class="panel-section">

                <h3>Laboratory Challenge</h3>

                <p class="muted" style="margin-top:10px;">
                    You completed a quick laboratory activity.
                </p>

                <p style="margin-top:10px;">
                    ⭐ +5 XP
                </p>

            </div>

            `

        );

    },

    rest(){

        if(!this.player) return;

        this.player.energy =
            Math.min(
                100,
                Number(this.player.energy || 0)+25
            );

        this.savePlayer();

        this.updateHUD();

        this.openPanel(

            "🛏️ Hostel",

            `

            <div class="panel-section">

                <h3>You rested.</h3>

                <p class="muted" style="margin-top:8px;">
                    Energy restored.
                </p>

            </div>

            `

        );

    },

    eat(){

        if(!this.player) return;

        const cost = 500;

        if(
            Number(this.player.money) <
            cost
        ){

            this.toast(
                "Not enough money."
            );

            return;

        }

        this.player.money -= cost;

        this.player.energy =
            Math.min(
                100,
                Number(this.player.energy || 0)+20
            );

        this.savePlayer();

        this.updateHUD();

        this.openPanel(

            "🍲 Canteen",

            `

            <div class="panel-section">

                <h3>Meal purchased.</h3>

                <p style="margin-top:8px;">
                    Energy +20
                </p>

                <p>
                    Money -₦500
                </p>

            </div>

            `

        );

    },

    /* =========================
       ARENA ENTRY
    ========================= */

    battle(){

        if(
            typeof window.openArena ===
            "function"
        ){

            window.openArena();

            return;

        }

        this.openPanel(

            "🏟️ Arena",

            `

            <h3>Academic Arena</h3>

            <p class="muted" style="margin-top:12px;">
                Arena system is loading...
            </p>

            `

        );

    },

    /* =========================
       MENU PLACEHOLDERS
    ========================= */

    openBank(){

        this.openPanel(

            "💰 Bank",

            `

            <div class="panel-section">

                <h3>
                    ₦${Number(this.player?.money || 0).toLocaleString()}
                </h3>

                <p class="muted">
                    Current balance
                </p>

            </div>

            `

        );

    },

    openShop(){

        this.openPanel(

            "🛒 Shop",

            `

            <div class="panel-section">

                <h3>Campus Shop</h3>

                <p class="muted" style="margin-top:8px;">
                    Items and upgrades will appear here.
                </p>

            </div>

            `

        );

    },

    openProperties(){

        this.openPanel(

            "🏠 Properties",

            `

            <div class="panel-section">

                <h3>Your Properties</h3>

                <p class="muted" style="margin-top:8px;">
                    Purchase and manage properties here.
                </p>

            </div>

            `

    },

    openGarage(){

        this.openPanel(

            "🚗 Garage",

            `

            <div class="panel-section">

                <h3>Your Garage</h3>

                <p class="muted" style="margin-top:8px;">
                    Vehicles will appear here.
                </p>

            </div>

            `

        );

    },

    openTournaments(){

        if(
            typeof window.openChampionship ===
            "function"
        ){

            window.openChampionship();

            return;

        }

        this.openPanel(

            "🏆 Events",

            `

            <div class="panel-section">

                <h3>PNGPD Events</h3>

                <p class="muted">
                    Events are loading...
                </p>

            </div>

            `

        );

    },

    /* =========================
       LOGOUT
    ========================= */

    async logout(){

        try{

            if(pngpdSupabase){

                await pngpdSupabase.auth.signOut();

            }

        }catch(error){

            console.error(error);

        }

        localStorage.removeItem(
            "pngpd_player"
        );

        this.player = null;

        this.showAuth();

    },

    /* =========================
       ESCAPE HTML
    ========================= */

    escapeHTML(value){

        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");

    }

};

window.PNGPD = PNGPD;

/* =========================================================
   STARTUP
========================================================= */

async function initializePNGPD(){

    setTimeout(async ()=>{

        document.getElementById(
            "splash"
        ).style.display = "none";

        if(!pngpdSupabase){

            PNGPD.showAuth();

            return;

        }

        try{

            const {data} =
                await pngpdSupabase.auth.getSession();

            if(data.session){

                await PNGPD.afterLogin(
                    data.session
                );

            }else{

                PNGPD.showAuth();

            }

        }catch(error){

            console.error(error);

            PNGPD.showAuth();

        }

    },1000);

}

initializePNGPD();

</script>
