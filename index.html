<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PNGPD LIFE 2.0</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#101525;
  color:white;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 20%,#ff3b3b 0,transparent 25%),
    radial-gradient(circle at 80% 20%,#ffd43b 0,transparent 25%),
    radial-gradient(circle at 50% 90%,#00d4ff 0,transparent 30%),
    linear-gradient(135deg,#32105f,#081426);
}

.splash-box{
  width:min(90%,520px);
}

.logo{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  font-weight:1000;
  background:linear-gradient(135deg,#ff2d55,#ff9f0a);
  box-shadow:0 15px 50px #0008;
  transform:rotate(-5deg);
}

.splash-box h1{
  font-size:clamp(38px,10vw,70px);
  margin-top:25px;
  font-weight:1000;
}

.splash-box p{
  margin-top:10px;
  color:#dce8ff;
}

.start-btn{
  margin-top:30px;
  padding:16px 42px;
  border-radius:50px;
  background:linear-gradient(135deg,#ff1744,#ff8f00);
  color:white;
  font-size:18px;
  font-weight:900;
  box-shadow:0 10px 30px #ff174466;
}

/* ================= AUTH ================= */

#auth{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 10% 10%,#ff1744 0,transparent 25%),
    radial-gradient(circle at 90% 90%,#00c853 0,transparent 25%),
    linear-gradient(135deg,#131b3a,#210b30);
}

.auth-card{
  width:min(94%,430px);
  padding:28px;
  border-radius:28px;
  background:#11182eee;
  border:2px solid #ffffff18;
  box-shadow:0 25px 70px #0009;
  backdrop-filter:blur(15px);
}

.auth-card h2{
  font-size:30px;
  margin-bottom:8px;
}

.auth-card p{
  color:#aebbd5;
  margin-bottom:22px;
}

.auth-card input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid #ffffff18;
  outline:none;
  background:#080d1c;
  color:white;
}

.auth-card button{
  width:100%;
  padding:15px;
  border-radius:14px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,#ff1744,#ff8f00);
}

/* ================= GAME ================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#202a34;
}

#viewport{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}

#viewport.dragging{
  cursor:grabbing;
}

#world{
  position:absolute;
  width:1800px;
  height:1200px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 15% 20%,#76c893 0 5%,transparent 5.3%),
    radial-gradient(circle at 80% 75%,#52b788 0 6%,transparent 6.3%),
    #69b578;
  overflow:hidden;
}

/* grass texture */
#world:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.18;
  background-image:
    radial-gradient(#fff 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
}

/* ================= ROADS ================= */

.road{
  position:absolute;
  background:#444c57;
  box-shadow:inset 0 0 0 5px #343b44;
}

.road.horizontal{
  height:115px;
  left:0;
  width:100%;
}

.road.vertical{
  width:115px;
  top:0;
  height:100%;
}

.road:after{
  content:"";
  position:absolute;
  background:repeating-linear-gradient(
    90deg,
    #ffd740 0 40px,
    transparent 40px 75px
  );
  opacity:.8;
}

.road.horizontal:after{
  height:5px;
  left:0;
  right:0;
  top:55px;
}

.road.vertical:after{
  width:5px;
  top:0;
  bottom:0;
  left:55px;
  background:repeating-linear-gradient(
    0deg,
    #ffd740 0 40px,
    transparent 40px 75px
  );
}

/* paths */
.path{
  position:absolute;
  background:#d8b978;
  border-radius:30px;
}

/* ================= TREES ================= */

.tree{
  position:absolute;
  width:55px;
  height:70px;
}

.tree:before{
  content:"";
  position:absolute;
  width:24px;
  height:35px;
  bottom:0;
  left:16px;
  border-radius:5px;
  background:#74472b;
}

.tree:after{
  content:"";
  position:absolute;
  width:55px;
  height:55px;
  top:0;
  left:0;
  border-radius:50%;
  background:#168447;
  box-shadow:
    -15px 12px 0 #21a354,
    15px 12px 0 #0e733e;
}

/* ================= BUILDINGS ================= */

.building{
  position:absolute;
  width:235px;
  height:165px;
  border-radius:22px;
  border:5px solid #ffffffaa;
  box-shadow:0 15px 25px #0005;
  overflow:visible;
  transition:.2s;
  z-index:10;
}

.building:hover{
  transform:translateY(-5px) scale(1.02);
}

.building .roof{
  position:absolute;
  left:-8px;
  right:-8px;
  top:-30px;
  height:42px;
  border-radius:20px 20px 8px 8px;
  background:#b71c1c;
  border:5px solid #ffffffaa;
}

.building .door{
  position:absolute;
  width:42px;
  height:65px;
  bottom:0;
  left:calc(50% - 21px);
  background:#4e342e;
  border:4px solid #222;
  border-bottom:0;
}

.building .window{
  position:absolute;
  width:34px;
  height:34px;
  top:65px;
  background:#72e5ff;
  border:4px solid #263238;
}

.building .window.left{
  left:28px;
}

.building .window.right{
  right:28px;
}

.building-label{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:-75px;
  white-space:nowrap;
  padding:8px 14px;
  border-radius:20px;
  background:#111c;
  color:#fff;
  font-size:15px;
  font-weight:1000;
  box-shadow:0 5px 15px #0005;
}

/* building colors */

.library{
  left:170px;
  top:210px;
  background:#e53935;
}

.classroom{
  left:680px;
  top:180px;
  background:#ff9800;
}

.arena{
  left:1160px;
  top:220px;
  background:#8e24aa;
}

.hostel{
  left:180px;
  top:760px;
  background:#1976d2;
}

.canteen{
  left:700px;
  top:760px;
  background:#f4511e;
}

.lab{
  left:1190px;
  top:730px;
  background:#00897b;
}

/* ================= PLAYER ================= */

#player{
  position:absolute;
  left:875px;
  top:500px;
  width:55px;
  height:70px;
  z-index:100;
  pointer-events:none;
}

.player-head{
  position:absolute;
  width:34px;
  height:34px;
  left:10px;
  top:0;
  border-radius:50%;
  background:#8d5524;
  border:3px solid #222;
}

.player-body{
  position:absolute;
  width:44px;
  height:38px;
  left:5px;
  top:30px;
  border-radius:12px 12px 5px 5px;
  background:#ff1744;
  border:3px solid #222;
}

.player-name{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:12px;
  font-weight:bold;
  background:#111c;
  padding:4px 8px;
  border-radius:8px;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  z-index:500;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hud-left{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.stat{
  padding:9px 13px;
  border-radius:15px;
  background:#101827eF;
  border:2px solid #ffffff15;
  box-shadow:0 5px 20px #0004;
  font-size:13px;
  font-weight:900;
}

.money{color:#69f0ae;}
.energy{color:#ffd740;}
.score{color:#40c4ff;}

.hud-right{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.hud-btn{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#111827ee;
  color:white;
  font-size:21px;
  border:2px solid #ffffff20;
}

/* ================= HELP ================= */

.map-hint{
  position:fixed;
  z-index:400;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 17px;
  border-radius:20px;
  background:#101827dd;
  color:#dce7ff;
  font-size:12px;
  pointer-events:none;
}

/* ================= PANEL ================= */

#panel{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:15px;
  transform:translate(-50%,120%);
  width:min(94%,650px);
  max-height:78vh;
  overflow:auto;
  padding:22px;
  border-radius:25px;
  background:#101827f5;
  border:2px solid #ffffff18;
  box-shadow:0 25px 70px #0009;
  transition:.3s;
}

#panel.open{
  transform:translate(-50%,0);
}

.panel-close{
  position:absolute;
  right:15px;
  top:12px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ff1744;
  color:white;
  font-weight:1000;
}

#panel h2{
  margin-right:45px;
  font-size:27px;
}

.panel-sub{
  margin-top:7px;
  color:#aebbd5;
}

.course-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin-top:18px;
}

.course-btn{
  min-height:75px;
  padding:12px;
  border-radius:15px;
  background:linear-gradient(135deg,#263b72,#412060);
  color:white;
  font-weight:900;
  text-align:left;
  border:2px solid #ffffff12;
}

.course-btn:hover{
  background:linear-gradient(135deg,#e91e63,#ff6d00);
}

.note-box{
  margin-top:18px;
  padding:17px;
  border-radius:18px;
  background:#080d18;
  border-left:5px solid #ff1744;
}

.note-box h3{
  margin-bottom:10px;
  color:#ffd740;
}

.note-box p,
.note-box li{
  color:#dce5f5;
  line-height:1.55;
}

.note-box ul{
  padding-left:20px;
}

.action-btn{
  margin-top:15px;
  width:100%;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#ff1744,#ff8f00);
  color:white;
  font-weight:1000;
}

/* ================= FOOD ================= */

.food-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:18px;
}

.food{
  padding:15px;
  border-radius:16px;
  background:#1c2940;
}

.food strong{
  display:block;
  margin-bottom:6px;
}

.food small{
  color:#9fb0c9;
}

.food button{
  margin-top:10px;
  padding:8px 12px;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-weight:bold;
}

/* ================= PROFILE ================= */

.profile-stat{
  display:flex;
  justify-content:space-between;
  padding:13px;
  margin-top:8px;
  border-radius:12px;
  background:#182238;
}

/* ================= MOBILE ================= */

@media(max-width:600px){
  #world{
    width:1800px;
    height:1200px;
  }

  .building{
    width:210px;
    height:150px;
  }

  .hud-left{
    max-width:70%;
  }

  .stat{
    padding:7px 9px;
    font-size:11px;
  }

  .map-hint{
    bottom:8px;
    font-size:10px;
  }

  #panel{
    max-height:82vh;
  }
}
</style>
</head>

<body>

<!-- ================= SPLASH ================= -->

<section id="splash">
  <div class="splash-box">
    <div class="logo">P</div>
    <h1>PNGPD LIFE</h1>
    <p>Petroleum & Natural Gas Processing Technology</p>
    <button class="start-btn" onclick="startGame()">START GAME</button>
  </div>
</section>

<!-- ================= AUTH ================= -->

<section id="auth">
  <div class="auth-card">
    <h2>Welcome to PNGPD LIFE</h2>
    <p>Create your student profile to enter campus.</p>

    <input id="playerNameInput" type="text" placeholder="Your name">

    <button onclick="enterCampus()">ENTER CAMPUS</button>
  </div>
</section>

<!-- ================= GAME ================= -->

<section id="game" class="hidden">

  <div id="viewport">

    <div id="world">

      <!-- ROADS -->

      <div class="road horizontal" style="top:455px;"></div>
      <div class="road horizontal" style="top:655px;"></div>
      <div class="road vertical" style="left:520px;"></div>
      <div class="road vertical" style="left:1050px;"></div>

      <!-- PATHS -->

      <div class="path" style="left:390px;top:350px;width:300px;height:28px;"></div>
      <div class="path" style="left:900px;top:350px;width:300px;height:28px;"></div>
      <div class="path" style="left:390px;top:690px;width:300px;height:28px;"></div>
      <div class="path" style="left:900px;top:690px;width:300px;height:28px;"></div>

      <!-- TREES -->

      <div class="tree" style="left:60px;top:80px;"></div>
      <div class="tree" style="left:400px;top:90px;"></div>
      <div class="tree" style="left:900px;top:80px;"></div>
      <div class="tree" style="left:1450px;top:90px;"></div>
      <div class="tree" style="left:1560px;top:350px;"></div>
      <div class="tree" style="left:80px;top:530px;"></div>
      <div class="tree" style="left:420px;top:600px;"></div>
      <div class="tree" style="left:900px;top:560px;"></div>
      <div class="tree" style="left:1450px;top:580px;"></div>
      <div class="tree" style="left:70px;top:950px;"></div>
      <div class="tree" style="left:500px;top:1030px;"></div>
      <div class="tree" style="left:1000px;top:1010px;"></div>
      <div class="tree" style="left:1550px;top:960px;"></div>

      <!-- LIBRARY -->

      <div class="building library" onclick="openLibrary()">
        <div class="roof"></div>
        <div class="building-label">📚 LIBRARY</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- CLASSROOM -->

      <div class="building classroom" onclick="openClassroom()">
        <div class="roof"></div>
        <div class="building-label">🎓 CLASSROOM</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- ARENA -->

      <div class="building arena" onclick="openArena()">
        <div class="roof"></div>
        <div class="building-label">⚔️ ARENA</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- HOSTEL -->

      <div class="building hostel" onclick="openHostel()">
        <div class="roof"></div>
        <div class="building-label">🏠 HOSTEL</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- CANTEEN -->

      <div class="building canteen" onclick="openCanteen()">
        <div class="roof"></div>
        <div class="building-label">🍲 CANTEEN</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- LAB -->

      <div class="building lab" onclick="openLab()">
        <div class="roof"></div>
        <div class="building-label">🧪 LABORATORY</div>
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <!-- PLAYER -->

      <div id="player">
        <div class="player-name" id="playerName">Student</div>
        <div class="player-head"></div>
        <div class="player-body"></div>
      </div>

    </div>
  </div>

  <!-- HUD -->

  <div id="hud">

    <div class="hud-left">
      <div class="stat">👤 <span id="hudName">Student</span></div>
      <div class="stat money">₦<span id="money">5000</span></div>
      <div class="stat energy">⚡ <span id="energy">100</span></div>
      <div class="stat score">⭐ <span id="score">0</span></div>
    </div>

    <div class="hud-right">
      <button class="hud-btn" onclick="openProfile()">👤</button>
      <button class="hud-btn" onclick="openLibrary()">📚</button>
    </div>

  </div>

  <div class="map-hint">
    👆 Drag the campus to look around • Tap a building to enter
  </div>

  <!-- PANEL -->

  <div id="panel">

    <button class="panel-close" onclick="closePanel()">×</button>

    <div id="panelContent"></div>

  </div>

</section>

function loadScript(src,done){

  script.src=src;

  script.onerror=function(){
    console.warn("Optional file unavailable:",src);

  document.body.appendChild(script);
}

/* ================= PAN / MAP ================= */

const viewport=document.getElementById("viewport");
const world=document.getElementById("world");

let panX=0;
let panY=0;
let dragging=false;
let startX=0;
let startY=0;
let startPanX=0;
let startPanY=0;

function centerWorld(){

  const vw=window.innerWidth;
  const vh=window.innerHeight;

  panX=(vw-1800)/2;
  panY=(vh-1200)/2;

  applyPan();
}

function applyPan(){

  world.style.transform=
    "translate(calc(-50% + "+panX+"px),calc(-50% + "+panY+"px))";
}

viewport.addEventListener("pointerdown",function(e){

  dragging=true;

  viewport.classList.add("dragging");

  startX=e.clientX;
  startY=e.clientY;

  startPanX=panX;
  startPanY=panY;

  viewport.setPointerCapture(e.pointerId);
});

viewport.addEventListener("pointermove",function(e){

  if(!dragging)return;

  panX=startPanX+(e.clientX-startX);
  panY=startPanY+(e.clientY-startY);

  applyPan();
});

viewport.addEventListener("pointerup",stopDragging);
viewport.addEventListener("pointercancel",stopDragging);

function stopDragging(){

  dragging=false;
  viewport.classList.remove("dragging");
}

window.addEventListener("resize",function(){

  if(!dragging) centerWorld();

});

function openCourse(course){

  const material=STUDY[course];

  if(!material){

    openPanel(`
      <h2>${course}</h2>
      <div class="note-box">
        <h3>📌 Notes</h3>
        <p>No short notes have been added for this course yet.</p>

  let list="";

  material.notes.forEach(function(note){

  });

  openPanel(`

    <div class="panel-sub">

      <h3>⚡ KEY NOTES</h3>

/* ================= QUESTION COUNT ================= */

function getQuestions(course){

  let result=[];

  if(
    window.PNGPD_QUESTIONS &&
    Array.isArray(window.PNGPD_QUESTIONS[course])
  ){
    result=window.PNGPD_QUESTIONS[course];
  }

  if(!result.length && LOCAL_QUESTIONS[course]){
    result=LOCAL_QUESTIONS[course];
  }

  return result;
}

function getCourseQuestionCount(course){

  return getQuestions(course).length;
}

/* ================= PRACTICE ================= */

function startPractice(course){

  const questions=getQuestions(course);

  if(!questions.length){

    openPanel(`
      <h2>📝 ${course} PRACTICE</h2>

      <div class="note-box">
        <h3>Question Bank</h3>
        <p>
          No questions have been added to this course yet.
          Your study notes are still available above.
        </p>
      </div>

      <button class="action-btn"
        onclick="openCourse('${course}')">
        ← BACK TO NOTES
      </button>
    `);

    return;
  }

  const shuffled=[...questions]
    .sort(function(){
      return Math.random()-.5;
    })
    .slice(0,Math.min(10,questions.length));

  let index=0;
  let correct=0;

  function showQuestion(){

    const q=shuffled[index];

    let options="";

    q.options.forEach(function(option,i){

      options+=`
        <button
          class="course-btn"
          style="width:100%;margin-top:8px;"
          onclick="answerPractice(${i})">
          ${String.fromCharCode(65+i)}. ${escapeHTML(option)}
        </button>
      `;

    });

    openPanel(`
      <h2>📝 ${course}</h2>

      <div class="panel-sub">
        Question ${index+1} of ${shuffled.length}
      </div>

      <div class="note-box">
        <h3>${escapeHTML(q.q)}</h3>
        ${options}
      </div>
    `);
  }

  window.answerPractice=function(choice){

    const q=shuffled[index];

    if(choice===q.answer){

      correct++;
      gameState.score+=10;
      updateHUD();

    }

    index++;

    if(index>=shuffled.length){

      openPanel(`
        <h2>🏆 PRACTICE COMPLETE</h2>

        <div class="note-box">
          <h3>Result</h3>

          <p>
            ${correct} / ${shuffled.length} correct
          </p>

          <p style="margin-top:10px;">
            Score: ${correct*10} points
          </p>
        </div>

        <button class="action-btn"
          onclick="openCourse('${course}')">
          📖 REVIEW NOTES
        </button>
      `);

      return;
    }

    showQuestion();
  };

  showQuestion();
}

/* ================= LAB QUIZ ================= */

function startLabQuiz(){

  const questions=[
    {
      q:"What does relative density compare?",
      a:[
        "Density of a substance with density of a reference substance",
        "Temperature with pressure",
        "Mass with time",
        "Volume with colour"
      ],
      correct:0
    },
    {
      q:"What is pour point?",
      a:[
        "Highest boiling temperature",
        "Lowest temperature at which oil remains sufficiently fluid to pour",
        "Density of crude oil",
        "Flash point only"
      ],
      correct:1
    },
    {
      q:"Which formula is used for API gravity?",
      a:[
        "API = 100 × SG",
        "API = SG / 141.5",
        "API = (141.5/SG) − 131.5",
        "API = SG + 131.5"
      ],
      correct:2
    }
  ];

  let current=0;
  let correct=0;

  function show(){

    const q=questions[current];

    let html="";

    q.a.forEach(function(option,i){

      html+=`
        <button
          class="course-btn"
          style="width:100%;margin-top:8px;"
          onclick="labAnswer(${i})">
          ${String.fromCharCode(65+i)}. ${option}
        </button>
      `;

    });

    openPanel(`
      <h2>🧪 LAB QUIZ</h2>

      <div class="panel-sub">
        Question ${current+1} of ${questions.length}
      </div>

      <div class="note-box">
        <h3>${q.q}</h3>
        ${html}
      </div>
    `);
  }

  window.labAnswer=function(answer){

    if(answer===questions[current].correct){
      correct++;
      gameState.score+=10;
      updateHUD();
    }

    current++;

    if(current>=questions.length){

      openPanel(`
        <h2>🏆 LAB QUIZ COMPLETE</h2>

        <div class="note-box">
          <h3>Result</h3>
          <p>${correct}/${questions.length} correct.</p>
          <p style="margin-top:8px;">
            +${correct*10} points
          </p>
        </div>
      `);

      return;
    }

    show();
  };

  show();
}

/* ================= SECURITY / TEXT ================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
