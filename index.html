<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PGP 122 Exam Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PGP 122</h1>
        <p>SEPARATION PROCESSES I</p>
        <span>🎮 EXAM CHALLENGE</span>
    </header>

    <main>

        <!-- HOME SCREEN -->
        <section id="home">

            <h2>Choose Your Challenge</h2>

            <div class="menu">

                <button onclick="startGame('mixed')">
                    🎯 Mixed Challenge
                </button>

                <button onclick="startGame('filtration')">
                    🧪 Filtration
                </button>

                <button onclick="startGame('evaporation')">
                    ♨️ Evaporation
                </button>

                <button onclick="startGame('membrane')">
                    🫧 Membrane Separation
                </button>

                <button onclick="startGame('mixing')">
                    ⚙️ Mixing & Agitation
                </button>

                <button onclick="startGame('leaching')">
                    🧴 Leaching & Extraction
                </button>

                <button onclick="startGame('boss')">
                    👹 BOSS MODE
                </button>

            </div>

        </section>


        <!-- GAME SCREEN -->
        <section id="game" class="hidden">

            <div class="top">

                <button onclick="goHome()">← Menu</button>

                <div>
                    Score:
                    <strong id="score">0</strong>
                </div>

                <div>
                    ⏱️ <strong id="timer">60</strong>
                </div>

            </div>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <p id="questionNumber"></p>

            <div class="question-box">

                <h2 id="question"></h2>

                <div id="answers"></div>

                <div id="feedback"></div>

                <button id="nextButton"
                        class="hidden"
                        onclick="nextQuestion()">
                    Next Question →
                </button>

            </div>

        </section>


        <!-- RESULT SCREEN -->
        <section id="result" class="hidden">

            <div class="result-box">

                <h2>🏆 Challenge Complete!</h2>

                <h1 id="finalScore"></h1>

                <p id="resultMessage"></p>

                <button onclick="goHome()">
                    Return to Menu
                </button>

                <button onclick="startGame(lastMode)">
                    🔄 Try Again
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>
            PGP 122 • PNGPD • Separation Processes I
        </p>

        <p>
            Built for exam preparation
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
