<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PNGPD LIFE</title>


<style>

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#06111d;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.screen{
    width:100%;
    height:100vh;
}

.hidden{
    display:none!important;
}


/* =========================
   SPLASH
========================= */

#splashScreen{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,200,150,.18),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #020811,
            #061827
        );
}

.splash-box{
    width:90%;
    max-width:500px;
}

.splash-icon{
    font-size:60px;
    margin-bottom:10px;
}

.splash-title{
    font-size:clamp(40px,10vw,70px);
    font-weight:900;
    color:#00d49b;
}

.splash-subtitle{
    margin-top:10px;
    color:#9bb0c2;
    letter-spacing:2px;
}

.splash-loading{
    margin-top:35px;
    color:#00d49b;
    font-size:14px;
}


/* =========================
   START / LOGIN / REGISTER
========================= */

#startScreen,
#registrationScreen,
#loginScreen{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,200,150,.12),
            transparent 45%
        ),
        #06111d;
}

.card{
    width:min(440px,100%);
    background:#0d1d2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:5px;
}

.title{
    text-align:center;
    font-size:36px;
    font-weight:900;
    color:#00d49b;
}

.subtitle{
    text-align:center;
    color:#9bb0c2;
    margin:8px 0 25px;
}

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
    font-weight:800;
}

.primary{
    background:#00d49b;
    color:#00150f;
}

.secondary{
    background:#172a3d;
    color:#fff;
}

.input{
    width:100%;
    padding:14px;
    margin-top:7px;
    margin-bottom:13px;

    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);

    background:#071522;
    color:#fff;
    outline:none;
}

.label{
    color:#a7b8c7;
    font-size:13px;
}


/* =========================
   ASSESSMENT
========================= */

#assessmentScreen{
    overflow:auto;
    background:#06111d;
    padding:20px;
}

.assessment-wrap{
    width:min(850px,100%);
    margin:auto;
}

.assessment-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    background:#0d1d2d;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.07);
}

.progress{
    width:100%;
    height:7px;
    background:#172b3e;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress div{
    width:0%;
    height:100%;
    background:#00d49b;
    transition:.3s;
}

.question-card{
    background:#0d1d2d;
    border-radius:18px;
    padding:25px;
    border:1px solid rgba(255,255,255,.08);
}

.question-number{
    color:#00d49b;
    font-weight:800;
}

.question{
    font-size:21px;
    line-height:1.5;
    margin:18px 0;
}

.option{
    width:100%;
    padding:15px;
    margin-top:10px;
    text-align:left;

    color:#fff;
    background:#162b3e;

    border:1px solid rgba(255,255,255,.07);
    border-radius:11px;
}

.option.selected{
    background:rgba(0,212,155,.18);
    border-color:#00d49b;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.controls button{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:0;
    background:#172a3d;
    color:#fff;
}
