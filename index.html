<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PNGPD LIFE 2.0</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
}

button{
    font:inherit;
    border:none;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   SPLASH
========================= */

#splash{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%,#ff334f 0 15%,transparent 50%),
        radial-gradient(circle at 80% 20%,#ff9f1c 0 10%,transparent 50%),
        radial-gradient(circle at 50% 80%,#8b2cff 0 12%,transparent 40%),
        linear-gradient(135deg,#4a0b3c,#101c4d 50%,#062d2a);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-align:center;
}

.logo{
    font-size:clamp(42px,10vw,90px);
    font-weight:900;
    letter-spacing:-3px;
    text-shadow:0 6px 0 #a80025,0 12px 25px rgba(0,0,0,.5);
}

.logo span{
    color:#ffd23f;
}

.tagline{
    margin-top:10px;
    font-size:18px;
    font-weight:800;
}

.start-btn{
    margin-top:30px;
    padding:18px 40px;
    border-radius:50px;
    background:#ff244f;
    color:#fff;
    font-size:20px;
    font-weight:900;
    box-shadow:0 8px 0 #a9002a,0 15px 30px rgba(0,0,0,.4);
}

.start-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #a9002a;
}

/* =========================
   AUTH
========================= */

#auth{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 10% 20%,#ff244f 0 10%,transparent 30%),
        radial-gradient(circle at 90% 80%,#ffb703 0 8%,transparent 25%),
        linear-gradient(135deg,#28104e,#102a52);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-card{
    width:min(400px,100%);
    background:#fff;
    border-radius:25px;
    box-shadow:0 25px 60px rgba(0,0,0,.3);
    padding:25px;
    text-align:center;
}

.auth-card h1{
    color:#ef1747;
    font-size:34px;
    font-weight:900;
}

.auth-card p{
    color:#555;
    margin:6px 0 20px;
}

.auth-card input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:2px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

.auth-card input:focus{
    border-color:#ff244f;
}

.auth-main{
    width:100%;
    padding:16px;
    margin-top:12px;
    border-radius:15px;
    background:#ff244f;
    color:#fff;
    font-size:18px;
    font-weight:900;
    box-shadow:0 6px 0 #a9002a;
}

.auth-switch{
    margin-top:15px;
    color:#6a22d9;
    font-weight:800;
    background:none;
    font-size:14px;
}

.auth-error{
    color:#e00032;
    margin-top:10px;
    font-weight:700;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;
    display:none;
    overflow:hidden;
    background:#6fbd48;
}

#world{
    position:absolute;
    width:1800px;
    height:1200px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        linear-gradient(45deg,#86d95d 0,#68bd45 60%);
    overflow:hidden;
}

/* =========================
   ROADS
========================= */

.road{
    position:absolute;
    background:#49494f;
    border:10px solid #37373c;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.05);
}

.road.horizontal{
    width:100%;
    height:100px;
    left:0;
}

.road.vertical{
    width:100px;
    height:100%;
    top:0;
}

.road.horizontal::after{
    content:"";
    position:absolute;
    top:45px;
    left:0;
    width:100%;
    height:10px;
    background:repeating-linear-gradient(
        90deg,
        transparent 0 40px,
        #ffd84a 40px 65px,
        transparent 65px 105px
    );
}

.road.vertical::after{
    content:"";
    position:absolute;
    top:0;
    left:45px;
    width:10px;
    height:100%;
    background:repeating-linear-gradient(
        0deg,
        transparent 0 40px,
        #ffd84a 40px 65px,
        transparent 65px 105px
    );
}

/* =========================
   PATHS
========================= */

.path{
    position:absolute;
    background:#e6c58c;
    border:5px solid #c9a36a;
    border-radius:20px;
}

/* =========================
   TREES
========================= */

.tree{
    position:absolute;
    width:70px;
    height:90px;
    z-index:5;
}

.tree .leaf{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#19a844;
    border:5px solid #08752d;
    box-shadow:
        -12px 6px 0 #23bd50,
        12px 6px 0 #0d9638;
}

.tree .trunk{
    position:absolute;
    width:18px;
    height:40px;
    background:#75401f;
    left:26px;
    top:45px;
    border-radius:8px;
}

/* =========================
   BUILDINGS
========================= */

.building{
    position:absolute;
    width:230px;
    height:150px;
    border-radius:15px;
    border:7px solid rgba(0,0,0,.2);
    box-shadow:
        0 12px 0 rgba(0,0,0,.15),
        0 20px 30px rgba(0,0,0,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-weight:900;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,.3);
    z-index:4;
}

.building .icon{
    font-size:48px;
}

.building .name{
    font-size:18px;
    margin-top:6px;
}

.library{
    left:270px;
    top:240px;
    background:linear-gradient(135deg,#ef1747,#ff5a36);
}

.classroom{
    left:900px;
    top:240px;
    background:linear-gradient(135deg,#ff8c00,#ffd23f);
    color:#542000;
}

.arena{
    left:1530px;
    top:240px;
    background:linear-gradient(135deg,#7c25e8,#c142ff);
}

.hostel{
    left:270px;
    top:720px;
    background:linear-gradient(135deg,#0077ff,#00c6ff);
}

.canteen{
    left:900px;
    top:720px;
    background:linear-gradient(135deg,#ff1744,#ff7b00);
}

.lab{
    left:1530px;
    top:720px;
    background:linear-gradient(135deg,#008cff,#00a86b);
}

/* =========================
   PLAYER
========================= */

#player{
    position:absolute;
    width:50px;
    height:60px;
    z-index:6;
    left:875px;
    top:570px;
}

.player-body{
    position:absolute;
    width:38px;
    height:42px;
    left:6px;
    bottom:0;
    border-radius:10px 10px 8px 8px;
    background:#ff1744;
    border:4px solid #9d0022;
}

.player-head{
    position:absolute;
    width:32px;
    height:32px;
    left:9px;
    top:-4px;
    border-radius:50%;
    background:#9b5b32;
    border:4px solid #603017;
}

.player-head::after{
    content:"";
    position:absolute;
    left:3px;
    top:-6px;
    width:25px;
    height:12px;
    border-radius:50%;
    background:#171717;
}

.player-shadow{
    position:absolute;
    width:40px;
    height:12px;
    bottom:0;
    left:5px;
    border-radius:50%;
    background:rgba(0,0,0,.3);
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hud-left{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.stat{
    pointer-events:auto;
    background:#fff;
    padding:9px 13px;
    border-radius:15px;
    border:3px solid #252525;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
    font-weight:900;
    display:flex;
    align-items:center;
    gap:4px;
    font-size:14px;
}

.stat.money{
    color:#008a3a;
}

.stat.xp{
    color:#6c1cff;
}

.stat.energy{
    color:#ff1744;
}

.hud-right{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.round-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#ffd23f;
    border:3px solid #222;
    font-size:22px;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:fixed;
    bottom:18px;
    left:18px;
    display:grid;
    grid-template-columns:60px 60px 60px;
    grid-template-rows:60px 60px;
    gap:5px;
    z-index:9;
}

.move-btn{
    background:#fff;
    border:3px solid #222;
    border-radius:15px;
    font-size:22px;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
}

.move-btn:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 rgba(0,0,0,.3);
}

.up{
    grid-column:2;
    grid-row:1;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}

/* =========================
   INTERACT
========================= */

#interact{
    position:fixed;
    bottom:25px;
    right:20px;
    z-index:9;
    padding:14px 22px;
    border-radius:20px;
    background:#ff1744;
    color:#fff;
    border:4px solid #8f0020;
    font-weight:900;
    font-size:16px;
    display:none;
    box-shadow:0 6px 0 #75001b;
}

/* =========================
   PANELS
========================= */

#panel{
    position:fixed;
    inset:0;
    background:rgba(12,8,30,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    backdrop-filter:blur(5px);
    z-index:20;
}

.panel-card{
    background:#fff;
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:25px;
    border:6px solid #222;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.panel-head{
    padding:16px 20px;
    background:linear-gradient(
        135deg,
        #ff1744,
        #ff7b00,
        #7c25e8
    );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.panel-head h2{
    font-size:24px;
    font-weight:900;
}

.close{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff;
    color:#222;
    font-size:20px;
    font-weight:900;
}

.panel-body{
    padding:20px;
}

/* =========================
   COURSES
========================= */

.course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.course-card{
    background:#112217;
    color:#fff;
    border-radius:20px;
    padding:12px;
    text-align:left;
    font-weight:900;
    border:4px solid #222;
}

.course-card:nth-child(6n+1){
    background:#ff1744;
}

.course-card:nth-child(6n+2){
    background:#ff7b00;
}

.course-card:nth-child(6n+3){
    background:#7c25e8;
}

.course-card:nth-child(6n+4){
    background:#008cff;
}

.course-card:nth-child(6n+5){
    background:#00a86b;
}

.course-card:nth-child(6n+6){
    background:#e91e63;
}

.course-card strong{
    font-size:18px;
    display:block;
}

.course-card small{
    font-size:12px;
    margin-top:6px;
    opacity:.9;
}

/* =========================
   QUIZ
========================= */

.quiz-progress{
    height:14px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.quiz-progress span{
    display:block;
    height:100%;
    background:linear-gradient(
        90deg,
        #ff1744,
        #ffb703,
        #7c25e8
    );
}

.question{
    font-weight:800;
    font-size:20px;
    color:#222;
    margin-bottom:12px;
}

.option{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:15px;
    background:#f4f4f7;
    border:3px solid #ddd;
    text-align:left;
    font-weight:800;
}

.option:hover{
    border-color:#ff1744;
    background:#fff1f4;
}

.option.correct{
    background:#a8f5c5;
    border-color:#00a34b;
}

.option.wrong{
    background:#ffc1cc;
    border-color:#e00032;
}

.next-btn{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:15px;
    background:#6c1cff;
    color:#fff;
    font-size:17px;
    font-weight:900;
}

/* =========================
   NOTES
========================= */

.note{
    padding:15px;
    border-radius:17px;
    background:#fff7d5;
    border-left:7px solid #ffb703;
    margin:10px 0;
}

.note h3{
    color:#e00032;
    margin-bottom:5px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    top:90px;
    transform:translateX(-50%) translateY(-20px);
    background:#222;
    color:#fff;
    padding:12px 18px;
    border-radius:15px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:30;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #world{
        transform:translate(-50%,-50%) scale(.8);
    }

    .building{
        transform:scale(.8);
    }

    .building .icon{
        font-size:36px;
    }

    .building .name{
        font-size:16px;
    }

    .stat{
        font-size:12px;
        padding:7px 9px;
    }

    .hud-right{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =========================
     SPLASH
========================= -->

<section id="splash">

    <div class="logo">
        PNGPD <span>LIFE</span>
    </div>

    <div class="tagline">
        2.0 YOUR CAMPUS. YOUR STORY. YOUR GAME.
    </div>

    <button
        class="start-btn"
        onclick="showAuth()"
    >
        PLAY NOW 🚀
    </button>

</section>


<!-- =========================
     AUTH
========================= -->

<section id="auth">

    <div class="auth-card">

        <h1 id="authTitle">
            Welcome Back 👋
        </h1>

        <p id="authText">
            Enter PNGPD LIFE and start your campus journey.
        </p>

        <input
            id="username"
            placeholder="Username"
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button
            class="auth-main"
            onclick="enterGame()"
        >
            ENTER PNGPD LIFE 🎮
        </button>

        <button
            class="auth-switch"
            onclick="toggleAuth()"
        >
            Create a new account
        </button>

        <div
            class="auth-error"
            id="authError"
        ></div>

    </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="game">

    <div id="world">

        <!-- ROADS -->

        <div
            class="road horizontal"
            style="top:45%;"
        ></div>

        <div
            class="road vertical"
            style="left:45%;"
        ></div>


        <!-- PATHS -->

        <div
            class="path"
            style="
                width:300px;
                height:40px;
                left:450px;
                top:230px;
            "
        ></div>

        <div
            class="path"
            style="
                width:300px;
                height:40px;
                left:450px;
                top:710px;
            "
        ></div>


        <!-- TREES -->

        <div
            class="tree"
            style="left:30px;top:30px;"
        >
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div
            class="tree"
            style="left:1750px;top:30px;"
        >
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div
            class="tree"
            style="left:30px;top:1100px;"
        >
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div
            class="tree"
            style="left:1750px;top:1100px;"
        >
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>


        <!-- BUILDINGS -->

        <div
            class="building library"
            onclick="enterLocation('library')"
        >
            <div class="icon">📚</div>
            <div class="name">LIBRARY</div>
        </div>


        <div
            class="building classroom"
            onclick="enterLocation('classroom')"
        >
            <div class="icon">🏫</div>
            <div class="name">CLASSROOM</div>
        </div>


        <div
            class="building arena"
            onclick="enterLocation('arena')"
        >
            <div class="icon">⚔️</div>
            <div class="name">ARENA</div>
        </div>


        <div
            class="building hostel"
            onclick="enterLocation('hostel')"
        >
            <div class="icon">🏠</div>
            <div class="name">HOSTEL</div>
        </div>


        <div
            class="building canteen"
            onclick="enterLocation('canteen')"
        >
            <div class="icon">🍔</div>
            <div class="name">CANTEEN</div>
        </div>


        <div
            class="building lab"
            onclick="enterLocation('lab')"
        >
            <div class="icon">🧪</div>
            <div class="name">LABORATORY</div>
        </div>


        <!-- PLAYER -->

        <div id="player">

            <div class="player-head"></div>

            <div class="player-body"></div>

            <div class="player-shadow"></div>

        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="hud-left">

            <div class="stat">
                👤
                <span id="playerName">
                    Student
                </span>
            </div>

            <div class="stat money">
                💰 ₦
                <span id="money">
                    5000
                </span>
            </div>

            <div class="stat xp">
                ⭐ XP
                <span id="xp">
                    0
                </span>
            </div>

            <div class="stat energy">
                ❤️
                <span id="energy">
                    100
                </span>
            </div>

        </div>


        <div class="hud-right">

            <button
                class="round-btn"
                onclick="openProfile()"
            >
                👤
            </button>

            <button
                class="round-btn"
                onclick="openLibrary()"
            >
                📚
            </button>

        </div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <button
            class="move-btn up"
            onpointerdown="move('up')"
        >
            ⬆️
        </button>

        <button
            class="move-btn left"
            onpointerdown="move('left')"
        >
            ⬅️
        </button>

        <button
            class="move-btn down"
            onpointerdown="move('down')"
        >
            ⬇️
        </button>

        <button
            class="move-btn right"
            onpointerdown="move('right')"
        >
            ➡️
        </button>

    </div>


    <!-- INTERACT -->

    <button
        id="interact"
        onclick="interact()"
    >
        ENTER LOCATION 🚪
    </button>

</section>


<!-- =========================
     PANEL
========================= -->

<div id="panel">

    <div class="panel-card">

        <div class="panel-head">

            <h2 id="panelTitle">
                PNGPD LIFE
            </h2>

            <button
                class="close"
                onclick="closePanel()"
            >
                ×
            </button>

        </div>

        <div
            class="panel-body"
            id="panelBody"
        ></div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<!-- QUESTION BANK -->

<script src="data/questions.js"></script>


<script>
/* =========================
   GAME STATE
========================= */

let player = {
    name:"Student",
    money:5000,
    xp:0,
    energy:100
};

let currentLocation = null;

let posX = 875;
let posY = 570;

const speed = 18;


/* =========================
   AUTH
========================= */

let authRegister = false;

function showAuth(){

    document.getElementById("splash").style.display = "none";

    document.getElementById("auth").style.display = "flex";

}


function toggleAuth(){

    authRegister = !authRegister;

    document.getElementById("authTitle").textContent =
        authRegister
        ? "Create Character 🚀"
        : "Welcome Back 👋";

    document.getElementById("authText").textContent =
        authRegister
        ? "Create your PNGPD LIFE account."
        : "Enter PNGPD LIFE and start your campus journey.";

    document.querySelector(".auth-main").textContent =
        authRegister
        ? "CREATE 🎮"
        : "ENTER 🎮";

    document.querySelector(".auth-switch").textContent =
        authRegister
        ? "I already have an account"
        : "Create a new account";
}


function enterGame(){

    const name =
        document.getElementById("username").value.trim()
        || "Student";

    player.name = name;

    document.getElementById("auth").style.display = "none";

    document.getElementById("game").style.display = "block";

    updateHUD();

    toast(
        "Welcome to PNGPD LIFE, "
        + name
        + "!"
    );

}


/* =========================

    document.getElementById("playerName").textContent =

    document.getElementById("xp").textContent =

}


/* =========================
   MOVEMENT
========================= */

function move(dir){

    if(dir === "up")
        posY -= speed;

    if(dir === "down")
        posY += speed;

    if(dir === "left")
        posX -= speed;

    if(dir === "right")
        posX += speed;


    posX = Math.max(
        30,
        Math.min(1770,posX)
    );

    posY = Math.max(
        30,
        Math.min(1110,posY)
    );


    const p =
        document.getElementById("player");

    p.style.left =
        posX + "px";

    p.style.top =
        posY + "px";


    camera();

    checkNearby();

}


/* =========================
   CAMERA
========================= */

function camera(){

    const world =
        document.getElementById("world");

    const vw =
        window.innerWidth;

    const vh =
        window.innerHeight;


    let left =
        -(posX - vw / 2);

    let top =
        -(posY - vh / 2);


    left =
        Math.min(
            0,
            Math.max(
                vw - 1800,
                left
            )
        );


    top =
        Math.min(
            0,
            Math.max(
                vh - 1200,
                top
            )
        );


    world.style.left =
        (vw / 2 + left) + "px";

    world.style.top =
        (vh / 2 + top) + "px";

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            document.getElementById("game")
            .style.display !== "block"
        )
            return;


        if(
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        )
            move("up");


        if(
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        )
            move("down");


        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        )
            move("left");


        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        )
            move("right");


        if(e.key === "Enter")
            interact();

    }
);


/* =========================
   BUILDING DETECTION
========================= */

function checkNearby(){

    currentLocation = null;

    const buildings = [

        ["library","Library"],

        ["classroom","Classroom"],

        ["hostel","Hostel"],

        ["canteen","Canteen"],

        ["lab","Laboratory"],

        ["arena","Arena"]

    ];


    let nearestDist = Infinity;

    let nearestName = null;


    buildings.forEach(
        ([key,label]) => {

            const el =
                document.querySelector(
                    `.building.${key}`
                );

            if(!el)
                return;


            const rect =
                el.getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width / 2;


            const centerY =
                rect.top +
                rect.height / 2;


            const dx =
                centerX -
                (posX + 25);


            const dy =
                centerY -
                (posY + 30);


            const dist =
                Math.hypot(dx,dy);


            if(dist < nearestDist){

                nearestDist = dist;

                nearestName = key;

            }

        }
    );


    if(nearestDist < 180){

        currentLocation =
            nearestName;

        enterLocation(
            nearestName
        );

    }
    else{

        document.getElementById(
            "interact"
        ).style.display = "none";

    }

}


/* =========================
   LOCATION
========================= */

function enterLocation(loc){

    const names = {

        library:
            "📚 PNGPD Library",

        classroom:
            "🏫 Classroom Block",

        hostel:
            "🏠 Student Hostel",

        canteen:
            "🍔 Campus Canteen",

        lab:
            "🧪 Process Lab",

        arena:
            "⚔️ PNGPD Arena"

    };


    const button =
        document.getElementById(
            "interact"
        );


    button.textContent =
        `ENTER ${names[loc] || ""}`;

    button.style.display =
        "block";

}


function interact(){

    if(!currentLocation){

        alert(
            "Walk near a building to enter."
        );

        return;

    }


    switch(currentLocation){

        case "library":
            openLibrary();
            break;

        case "classroom":
            openClassroom();
            break;

        case "hostel":
            openHostel();
            break;

        case "canteen":
            openCanteen();
            break;

        case "lab":
            openLab();
            break;

        case "arena":
            openArena();
            break;

    }

}

/* =========================
   LIBRARY
========================= */

function openLibrary(){

    let questions =
        window.PNGPD_QUESTIONS || [];


    questions =
        questions.filter(
            q =>
                q &&
                q.question &&
                Array.isArray(q.options) &&
                q.options.length >= 2
        );


    let courses =
        [
            ...new Set(
                questions.map(
                    q =>
                        (
                            q.course ||
                            q.subject ||
                            q.code ||
                            ""
                        ).trim()
                )
            )
        ];


    courses =
        courses
        .filter(c => c)
        .sort();


    let html = `

        <p
            style="
                font-weight:800;
                margin-bottom:15px;
            "
        >
            📚 Welcome to the Library!
            Select a course:
        </p>

        <div class="course-grid">

    `;


    if(courses.length === 0){

        html += `

            <div
                style="
                    padding:20px;
                    border-radius:15px;
                    background:#ffe5eb;
                    color:#d00035;
                    font-weight:900;
                    grid-column:1/-1;
                "
            >
                Question bank not found.
                Load
                <b>data/questions.js</b>.
            </div>

        `;

    }
    else{

        courses.forEach(
            course => {

                const count =
                    questions.filter(
                        q =>
                            (
                                q.course ||
                                q.subject ||
                                q.code
                            ) === course
                    ).length;


                html += `

                    <button
                        class="course-card"
                        onclick="
                            selectCourse(
                                '${encodeURIComponent(course)}'
                            )
                        "
                    >

                        <strong>
                            ${course}
                        </strong>

                        <small>
                            ${count} questions
                        </small>

                        <small>
                            ▶ START
                        </small>

                    </button>

                `;

            }
        );

    }


    html += `
        </div>
    `;


    openPanel(
        "📚 PNGPD Library",
        html
    );

}


/* =========================
   QUIZ
========================= */

let quizQuestions = [];

let quizIndex = 0;

let quizScore = 0;

let quizAnswered = false;

let currentCourse = "";


function selectCourse(encoded){

    const course =
        decodeURIComponent(encoded);


    const available =
        (
            window.PNGPD_QUESTIONS || []
        ).filter(
            q =>
                (
                    q.course ||
                    q.subject ||
                    q.code
                ) === course
        );


    if(available.length === 0){

        openPanel(
            "❌ No Questions",
            `
                <div class="note">
                    No questions found for
                    <b>${course}</b>.
                </div>
            `
        );

        return;

    }


    quizQuestions =
        available.slice();


    for(
        let i = quizQuestions.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            quizQuestions[i],
            quizQuestions[j]
        ] =
        [
            quizQuestions[j],
            quizQuestions[i]
        ];

    }


    quizQuestions =
        quizQuestions.slice(
            0,
            Math.min(
                30,
                quizQuestions.length
            )
        );


    quizIndex = 0;

    quizScore = 0;

    quizAnswered = false;

    currentCourse = course;


    renderQuiz();

}


function renderQuiz(){

    const q =
        quizQuestions[quizIndex];


    const percent =
        Math.round(
            (
                quizIndex /
                quizQuestions.length
            ) * 100
        );


    let html = `

        <div class="quiz-progress">

            <span
                style="
                    width:${percent}%;
                "
            ></span>

        </div>


        <div
            style="
                font-weight:900;
                color:#e00032;
                margin-bottom:8px;
            "
        >
            ${currentCourse}
            • Question
            ${quizIndex + 1}
            /
            ${quizQuestions.length}
        </div>


        <div class="question">
            ${q.question}
        </div>

    `;


    q.options.forEach(
        (opt,i) => {

            html += `

                <button
                    class="option"
                    id="opt${i}"
                    onclick="
                        answerQuestion(${i})
                    "
                >

                    <b>
                        ${String.fromCharCode(65+i)}.
                    </b>

                    ${opt}

                </button>

            `;

        }
    );


    html += `

        <button
            id="nextQuestion"
            class="next-btn"
            style="display:none;"
            onclick="nextQuestion()"
        >
            NEXT ➜
        </button>

    `;


    openPanel(
        "🧠 Course Challenge",
        html
    );

}


function answerQuestion(index){

    if(quizAnswered)
        return;


    quizAnswered = true;


    const q =
        quizQuestions[quizIndex];


    let correct =
        Number(q.answer);


    if(isNaN(correct)){

        const letAns =
            (q.answer || "")
            .toString()
            .trim()
            .toUpperCase();


        correct =
            "ABCD".indexOf(
                letAns
            );

    }


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        (btn,i) => {

            btn.disabled = true;


            if(i === correct)
                btn.classList.add(
                    "correct"
                );


            if(
                i === index &&
                i !== correct
            )
                btn.classList.add(
                    "wrong"
                );

        }
    );


    if(index === correct){

        quizScore++;

        player.xp += 10;

        localStorage.setItem(
            "pngpd_xp",
            player.xp
        );

        updateHUD();

        toast(
            "🔥 CORRECT! +10 XP"
        );

    }
    else{

        toast(
            "❌ Try again!"
        );

    }


    document.getElementById(
        "nextQuestion"
    ).style.display =
        "block";

}


function nextQuestion(){

    quizIndex++;


    if(
        quizIndex >=
        quizQuestions.length
    ){

        finishQuiz();

    }
    else{

        quizAnswered = false;

        renderQuiz();

    }

}


function finishQuiz(){

    const total =
        quizQuestions.length;


    const perc =
        Math.round(
            (
                quizScore /
                total
            ) * 100
        );


    const bonus =
        quizScore * 20;


    player.money += bonus;


    localStorage.setItem(
        "pngpd_money",
        player.money
    );


    updateHUD();


    let msg =
        "Keep studying!";


    if(perc >= 80)
        msg = "🏆 EXCELLENT!";

    else if(perc >= 60)
        msg = "👏 Good job!";

    else if(perc >= 40)
        msg = "💪 Keep practicing!";

    else
        msg = "📖 Review and try again.";


    openPanel(
        "🏁 Quiz Complete",
        `

            <div
                style="
                    text-align:center;
                "
            >

                <div
                    style="
                        font-size:50px;
                    "
                >
                    ${
                        perc >= 70
                        ? "🏆"
                        : "📚"
                    }
                </div>


                <h2
                    style="
                        font-size:32px;
                        color:#e00032;
                    "
                >
                    ${quizScore}/${total}
                </h2>


                <p
                    style="
                        font-size:22px;
                        font-weight:900;
                    "
                >
                    ${perc}%
                    -
                    ${msg}
                </p>


                <div class="note">

                    <h3>
                        Reward:
                    </h3>

                    <p>
                        💰
                        ₦${bonus.toLocaleString()}
                        earned!
                    </p>

                </div>


                <button
                    class="next-btn"
                    onclick="openLibrary()"
                >
                    BACK TO LIBRARY 📚
                </button>

            </div>

        `
    );

}

/* =========================
   TOAST
========================= */

function toast(msg){

    const el =
        document.getElementById(
            "toast"
        );


    el.textContent = msg;


    el.classList.add(
        "show"
    );


    clearTimeout(
        el._timer
    );


    el._timer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            2200
        );

}
